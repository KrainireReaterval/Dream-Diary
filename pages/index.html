<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Goblin+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .home-canvas {
      position: relative;
      width: 560px;
      height: 330px;
      background: white;
      transform-origin: center center;
      overflow: visible;
    }

    /* Nav links */
    .nav-link {
      position: absolute;
      top: 18px;
      font-family: 'Goblin One', serif;
      font-size: 12px;
      color: black;
      line-height: normal;
      white-space: nowrap;
      text-decoration: none;
    }

    .nav-blog     { left: 234px; }
    .nav-about    { left: 335px; }
    .nav-projects { left: 450px; }

    /* "Connecting The Dots" */
    .tagline {
      position: absolute;
      left: 221px;
      top: 170px;
      font-family: 'Goblin One', serif;
      font-size: 12px;
      color: black;
      line-height: normal;
      white-space: nowrap;
    }

    /* Small red dot — Ellipse1 at canvas (62, 264), 5x5 */
    .red-dot {
      position: absolute;
      left: 62px;
      top: 264px;
      width: 5px;
      height: 5px;
      background: red;
      border-radius: 50%;
    }

    /* "Escape" — vector-relative (395.34, 223.5), canvas (40, 279) */
    .escape-text {
      position: absolute;
      left: 40px;
      top: 279px;
      font-family: 'Goblin One', serif;
      font-size: 12px;
      color: black;
      line-height: normal;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="home-canvas">

    <!-- Vector1: spiral/coil line -->
    <svg style="position:absolute;left:0;top:55.5px;overflow:visible;" width="557" height="268" viewBox="0 0 557 268" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M596.34 267.512L642.34 0.511806C-69.6605 14.5118 -770.66 25.0118 -56.1604 115.512C515.44 187.912 264.006 209.678 66.8396 211.512" stroke="black"/>
    </svg>

    <!-- Nav -->
    <a class="nav-link nav-blog"     href="blog.html">blog</a>
    <a class="nav-link nav-about"    href="about.html">about</a>
    <a class="nav-link nav-projects" href="projects.html">projects</a>

    <!-- Tagline -->
    <p class="tagline">Connecting The Dots</p>

    <!-- Red focal dot -->
    <div class="red-dot"></div>

    <!-- Escape label at spiral tip -->
    <p class="escape-text">Escape</p>

  </div>

  <script>
    function scaleCanvas() {
      const canvas = document.querySelector('.home-canvas');
      const scaleX = window.innerWidth / 560;
      const scaleY = window.innerHeight / 330;
      const scale = Math.min(scaleX, scaleY);
      canvas.style.transform = 'scale(' + scale + ')';
    }

    scaleCanvas();
    window.addEventListener('resize', scaleCanvas);
  </script>
</body>
</html>
