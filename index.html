<!DOCTYPE html>
<html lang="en" class="page-home">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>

  <!--
    [CHANGED] All fonts consolidated into one request (was split across pages).
    rel="preconnect" hints let the browser open the connection early so the
    font CSS is not render-blocking.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Goblin+One&family=Hermeneus+One&family=Monofett&display=swap" rel="stylesheet">

  <!-- [CHANGED] Single external stylesheet; no inline <style> block -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<!--
  [CHANGED] class="page-home" triggers overflow:hidden + flex-center rules in
  styles.css (section 1) without needing a body-scoped inline style.
-->
<body class="page-home">

  <!--
    [CHANGED] data-canvas / data-w / data-h replace the page-specific
    scaleCanvas() function. main.js reads these and applies transform:scale().
    SVG width/height px attributes removed; sizing handled by CSS + viewBox.
  -->
  <div class="home-canvas" data-canvas data-w="560" data-h="330">

    <!-- Spiral / coil line — viewBox retained; px width/height moved to CSS -->
    <svg class="home-spiral-svg"
         viewBox="0 0 557 268"
         fill="none"
         xmlns="http://www.w3.org/2000/svg"
         aria-hidden="true">
      <path d="M596.34 267.512L642.34 0.511806C-69.6605 14.5118 -770.66 25.0118 -56.1604 115.512C515.44 187.912 264.006 209.678 66.8396 211.512" stroke="black"/>
    </svg>

    <!-- Nav links (part of the artistic canvas, not the fixed #site-nav) -->
    <a class="nav-link nav-blog"     href="blog.html">blog</a>
    <a class="nav-link nav-about"    href="about.html">about</a>
    <a class="nav-link nav-projects" href="projects.html">projects</a>

    <p class="tagline">Connecting The Dots</p>
    <div class="red-dot"></div>
    <p class="escape-text">Escape</p>

  </div>

  <!--
    [CHANGED] Scripts moved to <head> with defer (executes after HTML parse,
    before DOMContentLoaded, in source order — equivalent to end-of-body but
    allows the browser to discover and fetch scripts earlier).
    navigation.js intentionally excluded: home page uses canvas nav links.
  -->
  <script src="js/main.js" defer></script>
</body>
</html>
