<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Goblin+One&family=Hermeneus+One&family=Monofett&display=swap" rel="stylesheet">

  <!-- [CHANGED] No inline <style> block -->
  <link rel="stylesheet" href="css/styles.css">

  <script src="js/main.js" defer></script>
  <script src="js/navigation.js" defer></script>
</head>
<body>

  <section class="hero-section">
    <!--
      [CHANGED] data-scroll-to on each gray box replaces the addEventListener
      calls that were in the inline <script> block.
    -->
    <div class="projects-canvas" data-canvas data-w="560" data-h="340">

      <p class="projects-title">Projects</p>

      <div class="quote-block">
        <p>World is a game!</p>
        <p>I value experience and legacy.</p>
        <p>Build systems that eventually outruns me one day.</p>
      </div>

      <!-- Gray placeholder boxes — map to the three featured project cards -->
      <div class="proj-box proj-box-main"          data-scroll-to="highlight-one"></div>
      <div class="proj-box proj-box-top-right"     data-scroll-to="highlight-two"></div>
      <div class="proj-box proj-box-bottom-right"  data-scroll-to="highlight-three"></div>

    </div>
  </section>

  <section class="content-section">
    <div class="content-inner">
      <p class="section-label">featured</p>
      <div class="highlight-grid">
        <div class="highlight-card" id="highlight-one">
          <span class="card-date">—</span>
          <a href="#" class="card-title">Project One</a>
          <p class="card-excerpt">Placeholder — content TBD.</p>
        </div>
        <div class="highlight-card" id="highlight-two">
          <span class="card-date">—</span>
          <a href="#" class="card-title">Project Two</a>
          <p class="card-excerpt">Placeholder — content TBD.</p>
        </div>
        <div class="highlight-card" id="highlight-three">
          <span class="card-date">—</span>
          <a href="#" class="card-title">Project Three</a>
          <p class="card-excerpt">Placeholder — content TBD.</p>
        </div>
      </div>
      <p class="section-label">archive</p>
      <ul class="archive-list">
        <li><span class="entry-date">—</span><a href="#">Project Title</a></li>
        <li><span class="entry-date">—</span><a href="#">Project Title</a></li>
      </ul>
    </div>
  </section>

</body>
</html>
